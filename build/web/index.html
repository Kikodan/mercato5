html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

#orientation-overlay {
	display: none;
	position: fixed;
	top: 0;
	left: 0;
	width: 100vw;
	height: 100vh;
	background: #090d16;
	z-index: 99999999;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	color: #ffffff;
	font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
	text-align: center;
	padding: 24px;
	box-sizing: border-box;
}

@media screen and (orientation: portrait) {
	#orientation-overlay {
		display: flex !important;
	}
}

.phone-rotate-anim {
	width: 76px;
	height: 76px;
	margin-bottom: 24px;
	animation: phoneSpin 2.5s ease-in-out infinite;
}

@keyframes phoneSpin {
	0% { transform: rotate(0deg); }
	40% { transform: rotate(-90deg); }
	70% { transform: rotate(-90deg); }
	100% { transform: rotate(0deg); }
}
		</style>

		<script>
		// Orientation enforcement
		function enforceLandscape() {
			const overlay = document.getElementById('orientation-overlay');
			if (!overlay) return;
			const isPortrait = window.innerHeight > window.innerWidth;
			overlay.style.display = isPortrait ? 'flex' : 'none';

			if (screen.orientation && screen.orientation.lock) {
				screen.orientation.lock('landscape').catch(function () {});
			}
		}

		window.addEventListener('resize', enforceLandscape);
		window.addEventListener('orientationchange', enforceLandscape);
		window.addEventListener('DOMContentLoaded', enforceLandscape);
		window.addEventListener('load', enforceLandscape);
		document.addEventListener('touchstart', function () {
			if (screen.orientation && screen.orientation.lock) {
				screen.orientation.lock('landscape').catch(function () {});
			}
		}, { passive: true });

		// Safari iOS local network polyfill
		try {
			if (!window.isSecureContext) {
				Object.defineProperty(window, 'isSecureContext', { value: true, configurable: true });
			}
		} catch (e) {}
		try {
			const AudioCtx = window.AudioContext || window.webkitAudioContext;
			if (AudioCtx && !AudioCtx.prototype.audioWorklet) {
				Object.defineProperty(AudioCtx.prototype, 'audioWorklet', {
					get: function () {
						return {
							addModule: function () { return Promise.resolve(); }
						};
					}
				});
			}
		} catch (e) {}
		if (typeof window.AudioWorkletNode === 'undefined') {
			window.AudioWorkletNode = function () {
				return {
					connect: function () {},
					disconnect: function () {},
					port: { postMessage: function () {}, onmessage: null }
				};
			};
		}
		</script>

	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {

		}
		if (mode === 'hidden') {
			statusOverlay.remove();

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;

	const missing = Engine.getMissingFeatures({
